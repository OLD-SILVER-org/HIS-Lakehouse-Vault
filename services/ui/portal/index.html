<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Dashboards Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white border-end" id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom text-center py-4 fs-4 fw-bold">
            <i class="fas fa-chart-pie me-2"></i> BI Portal
        </div>
        <div class="list-group list-group-flush" id="dashboard-list">
            <!-- Dashboards will be loaded here dynamically -->
        </div>
    </div>
    <!-- /#sidebar-wrapper -->

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100 bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-outline-secondary" id="menu-toggle"><i class="fas fa-bars"></i></button>
                <h4 class="ms-3 mb-0 text-dark fw-bold" id="current-dashboard-title">Welcome to BI Portal</h4>
                <div class="ms-auto">
                    <span class="text-muted"><i class="fas fa-user-circle fs-4"></i></span>
                </div>
            </div>
        </nav>

        <div class="container-fluid p-0 h-100" id="iframe-container">
            <div id="welcome-message" class="d-flex flex-column justify-content-center align-items-center h-100">
                <i class="fas fa-chart-line text-muted mb-3" style="font-size: 5rem;"></i>
                <h2 class="text-muted">Select a dashboard to view</h2>
                <p class="text-muted">Please choose a dashboard from the sidebar on the left.</p>
            </div>
            <iframe id="dashboard-frame" src="" class="d-none w-100 h-100 border-0"></iframe>
        </div>
    </div>
    <!-- /#page-content-wrapper -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>

</body>
</html>
