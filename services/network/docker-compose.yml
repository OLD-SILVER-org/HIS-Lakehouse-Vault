# Network Services: WGDashboard, Caddy & Login Tracker
# Purpose: VPN Management, Reverse Proxy with Auth, and Login Monitoring
services:
  # WGDashboard: Web GUI for WireGuard management
  wgdashboard:
    image: ${NETWORK_WGDASHBOARD_IMAGE}
    container_name: wgdashboard
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      - TZ=${NETWORK_WGDASHBOARD_TZ:-Asia/Ho_Chi_Minh}
      - wgd_port=${NETWORK_WGDASHBOARD_PORT:-10086}
      - global_dns=${NETWORK_WGDASHBOARD_DNS:-8.8.8.8}
    volumes:
      - /opt/wgdashboard/wgd_data:/data
      - /opt/wgdashboard/wg_data:/etc/wireguard
      - /lib/modules:/lib/modules
    ports:
      - "${NETWORK_WGDASHBOARD_WG_PORT:-51820}:${NETWORK_WGDASHBOARD_WG_PORT:-51820}/udp"
    networks:
      - network_stack

  # Caddy: Reverse proxy with automatic HTTPS and BasicAuth
  caddy:
    image: ${NETWORK_CADDY_IMAGE}
    container_name: caddy
    restart: always
    env_file:
      - ../service_env.env
    environment:
      - NETWORK_DOMAIN=${NETWORK_DOMAIN}
      - NETWORK_EMAIL=${NETWORK_EMAIL}
      - NETWORK_WGDASHBOARD_PORT=${NETWORK_WGDASHBOARD_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /opt/wgdashboard/caddy_data:/data/caddy
      - /opt/wgdashboard/caddy_config:/config
      - caddy_logs:/data/logs
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8081:8081"
      - "18888:8888"
      - "18088:8088"
      - "18085:8085"
      - "18090:8090"
      - "18080:8080"
      - "19000:19000"
      - "19001:9001"
      - "19443:9443"
      - "18083:8083"
    depends_on:
      - wgdashboard
    networks:
      - network_stack
      - lake-net
      - serving-net
      - source-net
      - warehouse-net

  # Portal: Embedded Web Interface (Nginx)
  portal:
    image: nginx:alpine
    container_name: bi-portal
    restart: unless-stopped
    volumes:
      - ../ui/portal:/usr/share/nginx/html:ro
    networks:
      - network_stack

  # Login Tracker: Monitors Caddy access logs and sends Slack alerts on login
  login-tracker:
    image: python:3.12-slim
    container_name: login_tracker
    restart: always
    env_file:
      - ../service_env.env
    volumes:
      - caddy_logs:/data/logs:ro
      - ../scripts/login_tracker.py:/app/login_tracker.py:ro
      - /opt/his-lakehouse/services/data:/opt/his-lakehouse/services/data
    command: python /app/login_tracker.py
    depends_on:
      - caddy
    networks:
      - network_stack


# Shared network for the stack
networks:
  network_stack:
    name: network_stack
  source-net:
    external: true
  serving-net:
    external: true
  lake-net:
    external: true
  warehouse-net:
    external: true

volumes:
  caddy_logs:
