# Network Services: WGDashboard & Caddy
# Purpose: VPN Management and Reverse Proxy with Auto-SSL
services:
  # WGDashboard: Web GUI for WireGuard management
  wgdashboard:
    image: ${NETWORK_WGDASHBOARD_IMAGE}
    container_name: wgdashboard
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      - TZ=${NETWORK_WGDASHBOARD_TZ}
      - wgd_port=${NETWORK_WGDASHBOARD_PORT}
      - global_dns=${NETWORK_WGDASHBOARD_DNS}
    volumes:
      - /opt/wgdashboard/wgd_data:/data
      - /opt/wgdashboard/wg_data:/etc/wireguard
      - /lib/modules:/lib/modules
    ports:
      - "${NETWORK_WGDASHBOARD_WG_PORT}:${NETWORK_WGDASHBOARD_WG_PORT}/udp"
    networks:
      - network_stack

  # Caddy: Reverse proxy with automatic HTTPS
  caddy:
    image: ${NETWORK_CADDY_IMAGE}
    container_name: caddy
    restart: always
    environment:
      - NETWORK_DOMAIN=${NETWORK_DOMAIN}
      - NETWORK_EMAIL=${NETWORK_EMAIL}
      - NETWORK_WGDASHBOARD_PORT=${NETWORK_WGDASHBOARD_PORT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /opt/wgdashboard/caddy_data:/data
      - /opt/wgdashboard/caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - wgdashboard
    networks:
      - network_stack
      - lake-net
      - serving-net
      - source-net
      - warehouse-net


# Shared network for the stack
networks:
  network_stack:
    name: network_stack
  source-net:
    external: true
  serving-net:
    external: true
  lake-net:
    external: true
  warehouse-net:
    external: true
    
