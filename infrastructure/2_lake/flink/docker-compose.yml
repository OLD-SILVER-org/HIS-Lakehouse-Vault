services:
  flink-jobmanager:
    image: ${LAKE_FLINK_IMAGE}
    container_name: flink_jobmanager
    command: jobmanager
    env_file:
      - ../../../.env
    volumes:
      - ../jars/flink-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.1.0-1.18.jar
      - ../jars/flink-sql-connector-hive-1.18.1.jar:/opt/flink/lib/flink-sql-connector-hive-1.18.1.jar
      - ../jars/flink-connector-jdbc-1.18.1.jar:/opt/flink/lib/flink-connector-jdbc-1.18.1.jar
      - ../jars/hive-exec-3.1.3.jar:/opt/flink/lib/hive-exec-3.1.3.jar
      - ../jars/postgresql-42.7.9.jar:/opt/flink/lib/postgresql-42.7.9.jar
      - ../jars/hadoop-aws-3.3.4.jar:/opt/flink/lib/hadoop-aws-3.3.4.jar
      - ../jars/aws-java-sdk-bundle-1.12.785.jar:/opt/flink/lib/aws-java-sdk-bundle-1.12.785.jar
    ports:
      - "${LAKE_FLINK_JOBMANAGER_PORT}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - lake_net

  flink-taskmanager:
    image: ${LAKE_FLINK_IMAGE}
    container_name: flink_taskmanager
    command: taskmanager
    env_file:
      - ../../../.env
    volumes:
      - ../jars/flink-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.1.0-1.18.jar
      - ../jars/flink-sql-connector-hive-1.18.1.jar:/opt/flink/lib/flink-sql-connector-hive-1.18.1.jar
      - ../jars/flink-connector-jdbc-1.18.1.jar:/opt/flink/lib/flink-connector-jdbc-1.18.1.jar
      - ../jars/hive-exec-3.1.3.jar:/opt/flink/lib/hive-exec-3.1.3.jar
      - ../jars/postgresql-42.7.9.jar:/opt/flink/lib/postgresql-42.7.9.jar
      - ../jars/hadoop-aws-3.3.4.jar:/opt/flink/lib/hadoop-aws-3.3.4.jar
      - ../jars/aws-java-sdk-bundle-1.12.785.jar:/opt/flink/lib/aws-java-sdk-bundle-1.12.785.jar
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - lake_net

networks:
  lake_net:
    external: true
