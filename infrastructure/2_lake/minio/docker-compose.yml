services:
  # Lake Group: MinIO, Hive Metastore
  minio:
    image: ${LAKE_MINIO_IMAGE}
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "${LAKE_MINIO_PORT_API}:9000"
      - "${LAKE_MINIO_PORT_CONSOLE}:9001"
    env_file:
      - ../../../.env
    environment:
      MINIO_ROOT_USER: ${LAKE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${LAKE_MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    networks:
      - lake-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../../../.env
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 $${LAKE_MINIO_ROOT_USER} $${LAKE_MINIO_ROOT_PASSWORD};
      TEMP=$${LAKE_HIVE_WAREHOUSE_DIR#s3a://};
      BUCKET_NAME=$${TEMP%/};
      /usr/bin/mc mb myminio/$$BUCKET_NAME || true;
      /usr/bin/mc anonymous set public myminio/$$BUCKET_NAME;
      /usr/bin/mc mb myminio/$${MINIO_CHECKPOINT_BUCKET} || true;
      /usr/bin/mc anonymous set public myminio/$${MINIO_CHECKPOINT_BUCKET};
      exit 0;
      "
    networks:
      - lake-net

networks:
  lake-net:
    external: true
