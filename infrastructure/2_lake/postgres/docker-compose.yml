services:
  # =========================================
  # 1. PostgreSQL (Hive Metastore DB)
  # =========================================
  postgres-hive:
    image: ${LAKE_POSTGRES_IMAGE}
    container_name: hive-metastore-db
    restart: always
    env_file:
      - ../../../.env
    environment:
      POSTGRES_USER: ${LAKE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LAKE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LAKE_POSTGRES_DB}
    ports:
      - "${LAKE_POSTGRES_PORT}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LAKE_POSTGRES_USER} -d ${LAKE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - lake-net

networks:
  lake-net:
    external: true
