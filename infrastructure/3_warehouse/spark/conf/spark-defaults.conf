spark.eventLog.enabled              true
spark.eventLog.dir                  file:///tmp/spark-events
spark.history.fs.logDirectory       file:///tmp/spark-events

spark.driver.host                   spark-master
spark.driver.bindAddress            0.0.0.0
spark.driver.memory                 512m

spark.executor.memory               4g
spark.executor.cores                2
spark.cores.max                     2
spark.executor.memoryOverhead       512m
spark.executor.extraJavaOptions     -XX:+UseContainerSupport -XX:MaxDirectMemorySize=2g

# ============================================================
# LOW RAM OPTIMIZATION (for VPS with limited memory)
# Prevents exit code 134 / OOM crashes
# ============================================================

# Disable vectorized reading — forces row-by-row scan,
# drastically reduces Direct Memory / Netty buffer usage
spark.sql.iceberg.vectorization.enabled     false
spark.sql.parquet.enableVectorizedReader    false

# Limit partition size per task — prevents loading too much
# data into memory at once (default is 128MB, reduced to 16MB)
spark.sql.files.maxPartitionBytes           16777216
spark.sql.files.openCostInBytes             16777216

# Force sequential processing — reduces resource contention
# on single-core or low-CPU VPS environments
spark.sql.shuffle.partitions                1