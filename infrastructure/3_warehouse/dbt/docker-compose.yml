services:
  dbt:
    image: ${WAREHOUSE_DBT_IMAGE}
    container_name: dbt-warehouse
    volumes:
      - ./dbt_project:/usr/app/dbt
      - ./.dbt:/root/.dbt
    env_file:
      - ../../../.env
    ports:
      - "8182:8182"
    entrypoint: ""
    command: >
      /bin/sh -c "dbt deps && dbt docs generate && dbt docs serve --port 8182"
    networks:
      - warehouse-net

networks:
  warehouse-net:
    external: true
