services:
  # =========================================
  # 1. PostgreSQL (Source Transactional DB)
  # =========================================
  postgres-source:
    image: ${SOURCE_POSTGRES_IMAGE}
    container_name: postgres_source
    restart: always
    env_file:
      - ../../../.env
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
    ports:
      - "${SOURCE_POSTGRES_PORT}:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init-cdc-user.sql:/docker-entrypoint-initdb.d/10-init-cdc-user.sql
      - ./restore-dump.sh:/docker-entrypoint-initdb.d/20-restore-dump.sh
      - ./dumps/hospital-source-dump:/tmp/hospital-source-dump
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - hospital_network

networks:
  hospital_network:
    external: true
