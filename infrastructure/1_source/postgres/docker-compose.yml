services:
  # =========================================
  # 1. PostgreSQL (Source Transactional DB)
  # =========================================
  postgres-source:
    image: ${SOURCE_POSTGRES_IMAGE}
    container_name: postgres_source
    restart: always
    env_file:
      - ../../../.env
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
    ports:
      - "${SOURCE_POSTGRES_PORT}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - hospital_network

networks:
  hospital_network:
    external: true
